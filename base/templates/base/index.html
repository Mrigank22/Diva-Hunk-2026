{% load static tailwind_tags %}

{% block content %}
{% tailwind_css %}

<div class="w-full max-w-[1440px] mx-auto px-3 sm:px-5 md:px-16 py-6 sm:py-10 font-sans bg-white text-black relative z-10" id="vote_div">

    
    <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold uppercase mb-4 sm:mb-6 md:mb-8 tracking-wide text-black">

        Cast Your Votes
    </h2>

    <div class="flex w-full border border-black mb-8 md:mb-12">
        <button 
            onclick="switchTab('divas')" 
            id="tab-divas" 
            class="flex-1 py-2 sm:py-3 md:py-4 text-center text-xs sm:text-sm md:text-lg  font-bold uppercase transition-all duration-300 bg-black text-white hover:bg-gray-800 focus:outline-none">
            Alcher Diva
        </button>
        <button 
            onclick="switchTab('hunks')" 
            id="tab-hunks" 
            class="flex-1 py-2 sm:py-3 md:py-4 text-center text-xs sm:text-sm md:text-lg  font-bold uppercase transition-all duration-300 bg-white text-black hover:bg-gray-100 focus:outline-none">
            Alcher Hunk
        </button>
    </div>

    <div class="relative min-h-[500px]">
        
       <div id="divas-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-y-4 sm:gap-y-6 md:gap-y-10 gap-x-4 sm:gap-x-6 md:gap-x-8 animate-fade-in">

            {% for item in divas %}
            <div class="relative group w-full aspect-[3/4] bg-gray-200 overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300">
                <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-90"></div>

              <div class="absolute bottom-0 left-0 right-0 p-2 sm:p-3 md:p-4 flex justify-between items-end w-full">


    <p class="text-white 
text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl
font-medium tracking-wide leading-tight break-words max-w-[70%]">



                        {{ item.name }}
                    </p>
                    
                    <button 
                        onclick="window.location.href=`{% url 'diva_register' item.pk %}`"
                        class="bg-white text-black text-[10px] sm:text-xs md:text-sm font-bold px-2 sm:px-4 py-1.5 sm:py-2 uppercase whitespace-nowrap hover:bg-gray-200 transition-colors shadow-lg">
                        Vote Now
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>

       <div id="hunks-grid" class="hidden grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-y-4 sm:gap-y-6 md:gap-y-10 gap-x-4 sm:gap-x-6 md:gap-x-8 animate-fade-in">

            {% for hunk in hunks %}
            <div class="relative group w-full aspect-[2/3] sm:aspect-[3/4] bg-gray-200 overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300">
                <img src="{{ hunk.image.url }}" alt="{{ hunk.name }}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-90"></div>

               <div class="absolute bottom-0 left-0 right-0 p-2 sm:p-3 md:p-4 flex justify-between items-end w-full">


           <p class="text-white 
text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl
font-medium tracking-wide leading-tight break-words max-w-[70%]">


                        {{ hunk.name }}
                    </p>
                    
                    <button 
                        onclick="window.location.href=`{% url 'hunk_register' hunk.pk %}`"
                       class="bg-white text-black text-xs sm:text-sm font-bold px-4 sm:px-5 py-2 sm:py-2.5 uppercase hover:bg-gray-200 transition-colors shadow-lg">
                        Vote Now
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</div>

<script>
    function switchTab(type) {
        const divasGrid = document.getElementById('divas-grid');
        const hunksGrid = document.getElementById('hunks-grid');
        const tabDivas = document.getElementById('tab-divas');
        const tabHunks = document.getElementById('tab-hunks');

        if (type === 'divas') {
            // Show Divas Grid
            divasGrid.classList.remove('hidden');
            divasGrid.classList.add('grid');
            hunksGrid.classList.add('hidden');
            hunksGrid.classList.remove('grid');

            // Set Divas Tab Active (Black)
            tabDivas.classList.add('bg-black', 'text-white');
            tabDivas.classList.remove('bg-white', 'text-black');
            
            // Set Hunks Tab Inactive (White)
            tabHunks.classList.add('bg-white', 'text-black');
            tabHunks.classList.remove('bg-black', 'text-white');
            
        } else {
            // Show Hunks Grid
            hunksGrid.classList.remove('hidden');
            hunksGrid.classList.add('grid');
            divasGrid.classList.add('hidden');
            divasGrid.classList.remove('grid');

            // Set Hunks Tab Active (Black)
            tabHunks.classList.add('bg-black', 'text-white');
            tabHunks.classList.remove('bg-white', 'text-black');
            
            // Set Divas Tab Inactive (White)
            tabDivas.classList.add('bg-white', 'text-black');
            tabDivas.classList.remove('bg-black', 'text-white');
        }
    }
</script>

{% endblock content %}
